# Weekly pull requests for library and GitHub Actions updates.
# They target dev, so the tests check them before anything reaches main.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-libraries:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
